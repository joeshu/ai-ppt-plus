name: export-latest-skill
on:
  push:
    branches:
      - chore/export-latest-skill-20260905
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ai-ppt-plus-latest-main
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
