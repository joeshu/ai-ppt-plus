name: ai-ppt-plus CI

on:
  push:
  pull_request:

jobs:
  contract-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          python -m pip install --upgrade pip
          python -m pip install numpy pillow python-pptx pyyaml
      - name: Compile Python sources
        run: python -m py_compile scripts/*.py tests/test_*.py
      - name: Run schema, DAG, package and golden regressions
        run: python scripts/run_tests.py --report test-report.json
      - name: Check whitespace
        run: git diff --check
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-ppt-plus-test-report
          path: test-report.json
