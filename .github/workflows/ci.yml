name: ai-ppt-plus CI

on:
  push:
  pull_request:

jobs:
  contract-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils inkscape tesseract-ocr tesseract-ocr-chi-sim
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Verify SVG rendering dependency
        run: inkscape --version
      - name: Compile Python sources
        run: |
          python -m py_compile scripts/*.py tests/test_*.py
          python -m py_compile ai-ppt-visual-gen/scripts/*.py ai-ppt-visual-gen/tests/*.py
          python -m py_compile ai-ppt-editable/scripts/*.py ai-ppt-editable/tests/*.py
      - name: Validate all self-contained packages and routing contracts
        run: |
          python scripts/validate_skill_package.py --skill-dir .
          python scripts/validate_routing_contract.py
          python ai-ppt-visual-gen/scripts/validate_skill_package.py --skill-dir ai-ppt-visual-gen
          python ai-ppt-editable/scripts/validate_skill_package.py --skill-dir ai-ppt-editable
          python ai-ppt-editable/scripts/validate_routing_contract.py
          python ai-ppt-editable/scripts/validate_perfect_sync.py
      - name: Verify environment contract and runtime mirrors
        run: |
          python scripts/probe_environment.py --output environment-report.json
          python scripts/validate_environment_contract.py --report environment-report.json --output environment-validation.json
          python scripts/validate_runtime_mirror.py --report runtime-mirror-report.json
      - name: Run standalone worker smoke tests
        run: |
          python ai-ppt-visual-gen/scripts/run_tests.py --parallel-workers 4 --report visual-skill-test-report.json
          python ai-ppt-editable/scripts/run_tests.py --report editable-skill-test-report.json
      - name: Run schema, DAG, package and golden regressions
        run: python scripts/run_tests.py --parallel-workers 4 --report test-report.json
      - name: Replay social-channel editable PPTX case
        run: |
          set +e
          mkdir -p .distillation/case-baseline .distillation/case-candidate
          python scripts/replay_pptx_case.py \\
            --phase baseline \\
            --case-spec ai-ppt-editable/evals/social-channel-commission-native-01.json \\
            --deck ai-ppt-editable/evals/fixtures/social-channel-commission-editable-1.pptx \\
            --source-pptx ai-ppt-editable/evals/fixtures/social-channel-commission-editable-1.pptx \\
            --process-image ai-ppt-editable/evals/fixtures/social-channel-commission-green-screen-process.png \\
            --output-dir .distillation/case-baseline \\
            --output .distillation/case-baseline/baseline-evaluation.json
          baseline_rc=$?
          set -e
          test "$baseline_rc" -eq 2
          python scripts/replay_pptx_case.py \\
            --phase candidate \\
            --case-spec ai-ppt-editable/evals/social-channel-commission-native-01.json \\
            --deck ai-ppt-editable/evals/fixtures/social-channel-commission-native-01-candidate.pptx \\
            --source-pptx ai-ppt-editable/evals/fixtures/social-channel-commission-editable-1.pptx \\
            --process-image ai-ppt-editable/evals/fixtures/social-channel-commission-green-screen-process.png \\
            --baseline-evaluation .distillation/case-baseline/baseline-evaluation.json \\
            --output-dir .distillation/case-candidate \\
            --output .distillation/case-candidate/candidate-evaluation.json
          python scripts/validate_distillation_improvement.py \\
            --baseline .distillation/case-baseline/baseline-evaluation.json \\
            --candidate .distillation/case-candidate/candidate-evaluation.json \\
            --case-spec ai-ppt-editable/evals/social-channel-commission-native-01.json \\
            --mode replay \\
            --report .distillation/case-candidate/case-improvement.json

      - name: Run strict P2 guard smoke tests
        run: python tests/test_p2_guards.py
      - name: Check whitespace
        run: git diff --check
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-ppt-plus-test-report
          path: |
            test-report.json
            visual-skill-test-report.json
            editable-skill-test-report.json
            environment-report.json
            environment-validation.json
            runtime-mirror-report.json
            .distillation
