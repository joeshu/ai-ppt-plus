name: ai-ppt-plus CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice poppler-utils tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install pillow cairosvg python-pptx openpyxl lxml numpy scikit-image pyyaml fonttools
      - name: Verify SVG rendering dependency
        run: python -c "import cairosvg; print(cairosvg.__version__)"
      - name: Compile Python sources
        run: python -m compileall -q scripts tests ai-ppt-editable ai-ppt-visual-gen
      - name: Validate all self-contained packages and routing contracts
        run: |
          python scripts/validate_skill_package.py --skill-dir .
          python ai-ppt-visual-gen/scripts/validate_skill_package.py --skill-dir ai-ppt-visual-gen
          python ai-ppt-editable/scripts/validate_skill_package.py --skill-dir ai-ppt-editable
          python ai-ppt-editable/scripts/validate_routing_contract.py
      - name: Verify environment contract and runtime mirrors
        run: |
          python scripts/probe_environment.py --output environment-report.json
          python scripts/validate_environment_contract.py --report environment-report.json --output environment-validation.json
          python scripts/validate_runtime_mirror.py --root . --report runtime-mirror-report.json
      - name: Run standalone worker regression suites
        run: |
          python ai-ppt-visual-gen/scripts/run_tests.py --report visual-skill-test-report.json --parallel-workers 4
          python ai-ppt-editable/scripts/run_tests.py --report editable-skill-test-report.json --parallel-workers 4
      - name: Run complete root regression suite
        run: python scripts/run_tests.py --report test-report.json --parallel-workers 4
      - name: Check whitespace
        run: git diff --check
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-ppt-plus-test-report
          path: |
            test-report.json
            visual-skill-test-report.json
            editable-skill-test-report.json
            environment-report.json
            environment-validation.json
            runtime-mirror-report.json
