name: ai-ppt-plus CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice poppler-utils tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install pillow cairosvg python-pptx openpyxl lxml numpy scikit-image pyyaml fonttools
      - name: Verify SVG rendering dependency
        run: python -c "import cairosvg; print(cairosvg.__version__)"
      - name: Compile Python sources
        run: python -m compileall -q scripts tests ai-ppt-editable ai-ppt-visual-gen
      - name: Validate all self-contained packages and routing contracts
        run: |
          python scripts/validate_skill_package.py --skill-dir .
          python ai-ppt-visual-gen/scripts/validate_skill_package.py --skill-dir ai-ppt-visual-gen
          python ai-ppt-editable/scripts/validate_skill_package.py --skill-dir ai-ppt-editable
          python ai-ppt-editable/scripts/validate_routing_contract.py
      - name: Verify environment contract and runtime mirrors
        run: |
          python scripts/probe_environment.py --output environment-report.json
          python scripts/validate_environment_contract.py --report environment-report.json --output environment-validation.json
          python scripts/validate_runtime_mirror.py --repo-root . --output runtime-mirror-report.json
      - name: Run standalone worker smoke tests
        run: |
          python ai-ppt-visual-gen/scripts/run_tests.py --output visual-skill-test-report.json
          python ai-ppt-editable/scripts/run_tests.py --output editable-skill-test-report.json
      - name: Run Astra reconstruction contract tests
        run: |
          python ai-ppt-editable/tests/test_astra_reconstruction.py
          python ai-ppt-editable/tests/test_evidence_bridge.py
          python ai-ppt-editable/tests/test_asset_orchestrator.py
          python ai-ppt-editable/tests/test_asset_quality_qa.py
          python ai-ppt-editable/tests/test_asset_retry_policy.py
          python ai-ppt-editable/tests/test_repair_executors.py
          python ai-ppt-editable/tests/test_batch_ingestion.py
          python ai-ppt-editable/tests/test_accepted_state.py
      - name: Run schema, DAG and package regressions
        run: |
          python tests/test_package_metadata.py
          python tests/test_schema_contract.py
          python tests/test_pipeline_dag.py
          python tests/test_quality_gate.py
          python tests/test_difference_graph.py
          python tests/test_repair_router.py
          python tests/test_manifest_bridge.py
          python tests/test_astra_contract.py
          python tests/test_evidence_bridge.py
          python tests/test_asset_orchestrator.py
          python tests/test_asset_quality_qa.py
          python tests/test_asset_retry_policy.py
          python tests/test_repair_executors.py
          python tests/test_batch_ingestion.py
          python tests/test_accepted_state.py
      - name: Run core regression suite
        run: python scripts/run_tests.py --output test-report.json --jobs 4
      - name: Run strict P2 guard smoke tests
        run: |
          python tests/test_reference_input_preflight.py
          python tests/test_asset_hashes.py
          python tests/test_report_bundle.py
          python tests/test_visual_assertions.py
          python tests/test_content_inventory.py
          python tests/test_multipage_layout.py
          python tests/test_atomic_output.py
          python tests/test_authoring_contract.py
          python tests/test_preview_consistency.py
          python tests/test_performance_report.py
          python tests/test_component_instances.py
          python tests/test_run_pipeline_gate.py
      - name: Check whitespace
        run: git diff --check
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-ppt-plus-test-report
          path: |
            test-report.json
            visual-skill-test-report.json
            editable-skill-test-report.json
            environment-report.json
            environment-validation.json
            runtime-mirror-report.json
